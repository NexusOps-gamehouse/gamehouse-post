server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: gamehouse-post
  config:
    import:
      - optional:classpath:application-secret.yml
      - optional:file:./application-secret.yml
      - optional:file:../application-secret.yml

  # 서비스 간 이벤트 배달 (AMQP :5672).
  # 아래 최상위 rabbitmq.* 블록과 다른 것이다 — 그쪽은 채팅 메시지 릴레이(STOMP :61613).
  # 같은 브로커를 두 용도로 쓰고 포트가 다르다.
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_AMQP_PORT:5672}
    username: ${RABBITMQ_USERNAME:appuser}
    password: ${RABBITMQ_PASSWORD:apppass}
    # 기본값 60초. 브로커가 응답하지 않을 때 요청 스레드가 그만큼 붙잡힌다.
    # 실측에서 브로커 공백 35초 동안 요청이 그대로 36초를 기다렸고, 그 사이
    # DB 커넥션을 쥔 채라 풀(10개)이 7~9초 만에 고갈됐다. 그러면 브로커와
    # 무관한 조회 API 까지 같이 막힌다.
    #
    # 2초로 끊으면 장애 구간의 요청은 대부분 실패한다. 그 대신 커넥션이 돌아와
    # 서비스 전체는 살아남는다. 한 기능의 지연을 서비스 전체의 중단과 바꾸지 않는다.
    connection-timeout: ${RABBITMQ_CONNECTION_TIMEOUT:2s}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/duo}
    # 서비스 전용 DB 계정. 자기 스키마 밖은 권한이 없어서, 남의 테이블을 읽는
    # 쿼리는 개발 단계에서 permission denied 로 즉시 실패한다.
    #
    # 키 이름에 서비스명을 넣은 이유: application-secret.yml 은 네 서비스가
    # 공유한다. DB_USERNAME 같은 공통 키를 쓰면 한 값이 셋을 다 덮어써
    # 계정 분리가 무의미해진다.
    username: ${POST_DB_USERNAME:duo_post}
    password: ${POST_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        # 모든 쿼리에 스키마를 자동으로 붙인다.  posts → post_svc.posts
        # DB 계정의 search_path 도 같은 값으로 잡아두었다(V1 마이그레이션).
        # 둘 다 거는 이유: default_schema 는 Hibernate 가 만든 쿼리에만 적용되고,
        # 네이티브 쿼리는 search_path 를 탄다.
        default_schema: post_svc

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# 서비스 간 호출 주소.
# k8s 에서는 서비스 이름(http://user:8081)으로 들어오고, 로컬에서는 아래 기본값을 쓴다.
services:
  user:
    base-url: ${USER_SERVICE_URL:http://localhost:8081}
  post:
    base-url: ${POST_SERVICE_URL:http://localhost:8082}
  chat:
    base-url: ${CHAT_SERVICE_URL:http://localhost:8083}
  riot:
    base-url: ${RIOT_SERVICE_URL:http://localhost:8084}
  match:
    base-url: ${MATCH_SERVICE_URL:http://localhost:8085}

# ---------------------------------------------------------------------------
# Observability (Actuator + Micrometer)
#
# 관리 포트를 앱 포트와 분리한다. Ingress 에 이 포트 규칙이 없으므로
# 클러스터 안의 Prometheus 만 gamehouse-post:8182/actuator/prometheus 로 수집할 수 있다.
#
# exposure.include 는 화이트리스트다. /actuator/env, /actuator/heapdump 같은
# 민감한 엔드포인트가 열리지 않도록 필요한 것만 나열한다.
# ---------------------------------------------------------------------------
management:
  server:
    port: 8182
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: gamehouse-post
    distribution:
      # p95 / p99 를 구하려면 _bucket 메트릭이 필요하다.
      # Spring Boot 기본값은 _count / _sum / _max 만 내보내므로
      # 이 설정이 없으면 histogram_quantile(...) 이 항상 빈 결과가 된다.
      percentiles-histogram:
        http.server.requests: true    # 우리가 받는 요청
        http.client.requests: true    # 우리가 보내는 요청 (서비스 간 호출 포함)
      slo:
        http.server.requests: 50ms, 100ms, 200ms, 500ms, 1s, 2s, 5s
        http.client.requests: 100ms, 300ms, 500ms, 1s, 2s, 5s
      minimum-expected-value:
        http.server.requests: 10ms
      maximum-expected-value:
        http.server.requests: 10s
  observations:
    key-values:
      env: ${ENV_NAME:local}

# ---------------------------------------------------------------------------
# 채팅방 번호 보정
#
# posts.chat_room_id 는 ChatRoomCreatedEvent 로만 채워진다. 그 이벤트가 유실되면
# 되살릴 길이 없어, 주기적으로 빈 글을 찾아 PostCreatedEvent 를 다시 보낸다.
# 받는 쪽(chat 의 ensureRoom, post 의 ChatRoomCreatedConsumer)이 둘 다 멱등이라
# 여러 번 받아도 결과가 같다.
#
# 운영 실측 — 조치 전 22% 누락, 커밋 후 발행으로 바꾼 뒤 6.2% 누락(발행 실패분).
# ---------------------------------------------------------------------------
gamehouse:
  reconcile:
    chat-room:
      enabled: ${RECONCILE_CHAT_ROOM_ENABLED:true}
      # 실행 주기. 너무 짧으면 브로커가 죽어 있을 때 실패만 반복한다.
      interval-ms: ${RECONCILE_CHAT_ROOM_INTERVAL_MS:120000}
      # 기동 직후에는 건너뛴다. 다른 파드와 동시에 뜨면 같은 행을 함께 집는다.
      initial-delay-ms: ${RECONCILE_CHAT_ROOM_INITIAL_DELAY_MS:60000}
      # 갓 만든 글은 아직 왕복 중일 수 있다. 이만큼 지난 것만 본다.
      min-age-seconds: ${RECONCILE_CHAT_ROOM_MIN_AGE_SECONDS:300}
      # 한 주기 상한. 브로커가 오래 죽어 수천 건이 밀렸을 때를 위한 것이다.
      batch-size: ${RECONCILE_CHAT_ROOM_BATCH_SIZE:200}
